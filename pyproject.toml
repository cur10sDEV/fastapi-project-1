[project]
name = "fastapi-start"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "black>=26.5.1",
    "fastapi[standard]>=0.140.13",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[tool.fastapi]
entrypoint = "src.main:app"
